[workspace]
members = [
    "src-tauri",
    "crates/usb-types",
    "crates/usb-collector-macos",
    "crates/usb-collector-linux",
    "crates/usb-collector-windows",
    "crates/hid-parser",
    "crates/usb-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
