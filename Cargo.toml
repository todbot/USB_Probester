[workspace.package]
version = "0.3.0"

[workspace]
members = [
    "src-tauri",
    "crates/usb-types",
    "crates/usb-collector-macos",
    "crates/usb-collector-linux",
    "crates/usb-collector-windows",
    "crates/usb-formatter",
    "crates/hid-parser",
    "crates/usb-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

# Stripped proc-macro dylibs get a mis-aligned LINKEDIT string pool that macOS 27
# dyld refuses to load, so rustc can't open them (rust-lang/rust#157750). Fixed in
# upstream 1.98, but Homebrew's rustc links its own LLVM and still emits them.
[profile.release.build-override]
strip = false
